<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm col-md-8 mx-auto">
        <div class="card-header bg-primary text-white py-3">
            <h2 class="mb-0 fs-4 fw-bold">Payment Details</h2>
        </div>
        <div class="card-body p-4">
            <div th:if="${payment != null}">
                <div class="row mb-3">
                    <div class="col-sm-4 fw-bold">Payment ID</div>
                    <div class="col-sm-8" th:text="${payment.id}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-sm-4 fw-bold">Order ID</div>
                    <div class="col-sm-8" th:text="${payment.order.id}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-sm-4 fw-bold">Method</div>
                    <div class="col-sm-8" th:text="${payment.method}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-sm-4 fw-bold">Status</div>
                    <div class="col-sm-8">
                        <span th:classappend="${payment.status == 'SUCCESS' ? 'bg-success' : 'bg-danger'}" 
                              class="badge rounded-pill" th:text="${payment.status}"></span>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-sm-4 fw-bold">Payment Data</div>
                    <div class="col-sm-8">
                        <ul class="list-unstyled">
                            <li th:each="entry : ${payment.paymentData}">
                                <span class="fw-medium" th:text="${entry.key} + ': '"></span>
                                <span th:text="${entry.value}"></span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div th:unless="${payment != null}" class="alert alert-warning">
                Payment not found.
            </div>
        </div>
        <div class="card-footer bg-white text-center py-3">
            <a th:href="@{/payment/detail}" class="btn btn-secondary btn-sm">New Search</a>
            <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">Back Home</a>
        </div>
    </div>
</div>
</body>
</html>
