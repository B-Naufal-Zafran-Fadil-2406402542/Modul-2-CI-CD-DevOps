<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Admin Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm col-md-8 mx-auto">
        <div class="card-header bg-dark text-white py-3">
            <h2 class="mb-0 fs-4 fw-bold">Manage Payment</h2>
        </div>
        <div class="card-body p-4">
            <div class="row mb-3">
                <div class="col-sm-4 fw-bold">Payment ID</div>
                <div class="col-sm-8" th:text="${payment.id}"></div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-4 fw-bold">Order ID</div>
                <div class="col-sm-8" th:text="${payment.order.id}"></div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-4 fw-bold">Status</div>
                <div class="col-sm-8">
                    <span th:classappend="${payment.status == 'SUCCESS' ? 'bg-success' : 'bg-danger'}" 
                          class="badge rounded-pill" th:text="${payment.status}"></span>
                </div>
            </div>

            <hr class="my-4">

            <h5 class="mb-3 fw-bold">Change Status</h5>
            <form th:action="@{/payment/admin/set-status/{id}(id=${payment.id})}" method="post">
                <div class="mb-4">
                    <label for="status" class="form-label">Select New Status</label>
                    <select id="status" name="status" class="form-select" required>
                        <option value="SUCCESS" th:selected="${payment.status == 'SUCCESS'}">SUCCESS</option>
                        <option value="REJECTED" th:selected="${payment.status == 'REJECTED'}">REJECTED</option>
                    </select>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Update Status</button>
                    <a th:href="@{/payment/admin/list}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
