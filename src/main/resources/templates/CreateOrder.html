<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white py-3 text-center">
                    <h2 class="mb-0 fs-4">Create New Order</h2>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/order/create}" method="post">
                        <div class="mb-4">
                            <label for="author" class="form-label fw-medium text-dark">Your Name</label>
                            <input type="text" id="author" name="author" class="form-control" placeholder="Enter author name" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary shadow-sm py-2">Create Order</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer bg-white py-3 text-center border-0">
                    <a th:href="@{/}" class="text-decoration-none text-muted small">
                        <i class="bi bi-arrow-left me-1"></i> Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
