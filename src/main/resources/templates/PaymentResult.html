<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5 text-center">
    <div class="card shadow-sm col-md-6 mx-auto">
        <div class="card-header bg-primary text-white py-3">
            <h2 class="mb-0 fs-4 fw-bold">Payment Status</h2>
        </div>
        <div class="card-body p-5">
            <div class="mb-4">
                <i th:if="${payment.status == 'SUCCESS'}" class="bi bi-check-circle-fill text-success fs-1"></i>
                <i th:if="${payment.status == 'REJECTED'}" class="bi bi-x-circle-fill text-danger fs-1"></i>
            </div>
            <h3 class="fw-bold mb-3" th:text="${payment.status}"></h3>
            <p class="text-muted mb-4">Payment ID: <span th:text="${payment.id}"></span></p>
            <p class="text-muted mb-4">Order ID: <span th:text="${payment.order.id}"></span></p>
            
            <div class="d-grid gap-2">
                <a th:href="@{/order/history/{author}(author=${payment.order.author})}" class="btn btn-primary">Go to My History</a>
                <a th:href="@{/}" class="btn btn-outline-secondary">Back Home</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
