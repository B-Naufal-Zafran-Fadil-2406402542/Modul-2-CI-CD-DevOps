<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Admin List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
            <h2 class="mb-0 fs-4">All Payments (Admin)</h2>
            <a th:href="@{/}" class="btn btn-outline-light btn-sm">Home</a>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col" class="ps-3">Payment ID</th>
                        <th scope="col">Method</th>
                        <th scope="col">Status</th>
                        <th scope="col" class="text-center">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="payment: ${payments}">
                        <td class="ps-3 fw-medium" th:text="${payment.id}"></td>
                        <td th:text="${payment.method}"></td>
                        <td>
                            <span th:classappend="${payment.status == 'SUCCESS' ? 'bg-success' : 'bg-danger'}" 
                                  class="badge rounded-pill" th:text="${payment.status}"></span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/payment/admin/detail/{id}(id=${payment.id})}" class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-gear"></i> Manage
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(payments)}">
                        <td colspan="4" class="text-center py-4 text-muted">No payments recorded.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
