<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Detail Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5 text-center">
    <div class="card shadow-sm col-md-6 mx-auto">
        <div class="card-header bg-primary text-white py-3">
            <h2 class="mb-0 fs-4 fw-bold">Search Payment Details</h2>
        </div>
        <div class="card-body p-4">
            <form onsubmit="this.action='/payment/detail/' + this.paymentId.value;">
                <div class="mb-4">
                    <label for="paymentId" class="form-label fw-medium">Enter Payment ID</label>
                    <input type="text" id="paymentId" name="paymentId" class="form-control" placeholder="Payment ID" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Search</button>
                </div>
            </form>
        </div>
        <div class="card-footer bg-white border-0">
            <a th:href="@{/}" class="text-decoration-none text-muted">Back to Home</a>
        </div>
    </div>
</div>
</body>
</html>
