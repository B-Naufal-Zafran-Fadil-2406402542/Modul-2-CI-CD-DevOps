<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pay Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-primary text-white py-3 text-center border-0 rounded-top">
                    <h2 class="mb-0 fs-4 fw-bold">Pay Order: <span th:text="${order.id}"></span></h2>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/order/pay/{id}(id=${order.id})}" method="post">
                        <div class="mb-4">
                            <label for="method" class="form-label fw-medium text-dark">Payment Method</label>
                            <select id="method" name="method" class="form-select" onchange="showFields()" required>
                                <option value="" disabled selected>Select method</option>
                                <option value="VOUCHER_CODE">Voucher Code</option>
                                <option value="BANK_TRANSFER">Bank Transfer</option>
                            </select>
                        </div>

                        <div id="voucherFields" style="display:none;" class="mb-4 p-3 bg-light border rounded">
                            <label for="voucherCode" class="form-label fw-medium">Voucher Code</label>
                            <input type="text" id="voucherCode" name="voucherCode" class="form-control" placeholder="ESHOP1234ABC5678">
                        </div>

                        <div id="bankFields" style="display:none;" class="mb-4 p-3 bg-light border rounded">
                            <div class="mb-3">
                                <label for="bankName" class="form-label fw-medium">Bank Name</label>
                                <input type="text" id="bankName" name="bankName" class="form-control" placeholder="BCA">
                            </div>
                            <div class="mb-3">
                                <label for="referenceCode" class="form-label fw-medium">Reference Code</label>
                                <input type="text" id="referenceCode" name="referenceCode" class="form-control" placeholder="12345678">
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg shadow-sm py-2 fw-bold">Submit Payment</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function showFields() {
        var method = document.getElementById("method").value;
        document.getElementById("voucherFields").style.display = method === "VOUCHER_CODE" ? "block" : "none";
        document.getElementById("bankFields").style.display = method === "BANK_TRANSFER" ? "block" : "none";
    }
</script>
</body>
</html>
